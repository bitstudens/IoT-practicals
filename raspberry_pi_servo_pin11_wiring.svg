<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="85" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#202124">Mini Servo Wiring Using Raspberry Pi Physical Pin 11</text>
<text x="70" y="130" font-family="Arial,sans-serif" font-size="27" fill="#4d5156">Signal uses GPIO17. Power comes from the Raspberry Pi 5V pin.</text>

<rect x="80" y="230" width="420" height="500" rx="30" fill="#e4edff" stroke="#3b66ad" stroke-width="5"/>
<text x="175" y="315" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#24416d">Mini Servo</text>
<text x="205" y="360" font-family="Arial,sans-serif" font-size="27" fill="#3d5d8f">SG90-style</text>
<circle cx="292" cy="487" r="82" fill="#f3f3f3" stroke="#888" stroke-width="4"/>
<rect x="284" y="365" width="16" height="130" fill="#b7b7b7" stroke="#777" stroke-width="2"/>
<circle cx="292" cy="373" r="23" fill="#e7e7e7" stroke="#777" stroke-width="3"/>

<rect x="1130" y="190" width="490" height="600" rx="30" fill="#e3f4e8" stroke="#2f6f44" stroke-width="5"/>
<text x="1220" y="275" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#193d26">Raspberry Pi</text>
<text x="1205" y="320" font-family="Arial,sans-serif" font-size="26" fill="#315d3e">40-pin GPIO header</text>
<text x="1287" y="360" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#4d5156">Odd pins</text>
<text x="1430" y="360" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#4d5156">Even pins</text>

<circle cx="1330" cy="390" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="390" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="397" font-family="Arial" font-size="22" font-weight="700" fill="#202124">1</text>
<text x="1480" y="397" font-family="Arial" font-size="22" font-weight="700" fill="#202124">2</text>

<circle cx="1330" cy="452" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="452" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="459" font-family="Arial" font-size="22" font-weight="700" fill="#202124">3</text>
<text x="1480" y="459" font-family="Arial" font-size="22" font-weight="700" fill="#202124">4</text>

<circle cx="1330" cy="514" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="514" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="521" font-family="Arial" font-size="22" font-weight="700" fill="#202124">5</text>
<text x="1480" y="521" font-family="Arial" font-size="22" font-weight="700" fill="#202124">6</text>

<circle cx="1330" cy="576" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="576" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="583" font-family="Arial" font-size="22" font-weight="700" fill="#202124">7</text>
<text x="1480" y="583" font-family="Arial" font-size="22" font-weight="700" fill="#202124">8</text>

<circle cx="1330" cy="638" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="638" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="645" font-family="Arial" font-size="22" font-weight="700" fill="#202124">9</text>
<text x="1480" y="645" font-family="Arial" font-size="22" font-weight="700" fill="#202124">10</text>

<circle cx="1330" cy="700" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<circle cx="1450" cy="700" r="12" fill="#c7a64b" stroke="#6c581d" stroke-width="2"/>
<text x="1265" y="707" font-family="Arial" font-size="22" font-weight="700" fill="#202124">11</text>
<text x="1480" y="707" font-family="Arial" font-size="22" font-weight="700" fill="#202124">12</text>

<circle cx="1450" cy="390" r="19" fill="#d62828" stroke="#202124" stroke-width="3"/>
<rect x="1490" y="366" width="105" height="48" rx="10" fill="white" stroke="#d62828" stroke-width="3"/>
<text x="1504" y="397" font-family="Arial" font-size="21" font-weight="700" fill="#d62828">5V</text>

<circle cx="1450" cy="514" r="19" fill="#6f4e37" stroke="#202124" stroke-width="3"/>
<rect x="1490" y="490" width="105" height="48" rx="10" fill="white" stroke="#6f4e37" stroke-width="3"/>
<text x="1504" y="521" font-family="Arial" font-size="21" font-weight="700" fill="#6f4e37">GND</text>

<circle cx="1330" cy="700" r="19" fill="#f28c28" stroke="#202124" stroke-width="3"/>
<rect x="1150" y="676" width="125" height="48" rx="10" fill="white" stroke="#f28c28" stroke-width="3"/>
<text x="1164" y="707" font-family="Arial" font-size="21" font-weight="700" fill="#f28c28">GPIO17</text>

<polyline points="500,590 780,590 1020,590 1020,390 1450,390" fill="none" stroke="white" stroke-width="24" stroke-linejoin="round"/>
<polyline points="500,590 780,590 1020,590 1020,390 1450,390" fill="none" stroke="#d62828" stroke-width="13" stroke-linejoin="round"/>
<polygon points="1425,376 1446,390 1425,404" fill="#d62828"/>
<rect x="560" y="542" width="400" height="42" rx="10" fill="white" stroke="#d62828" stroke-width="3"/>
<text x="580" y="570" font-family="Arial" font-size="21" font-weight="700" fill="#d62828">Red wire → 5V, pin 2</text>

<polyline points="500,650 780,650 1060,650 1060,514 1450,514" fill="none" stroke="white" stroke-width="24" stroke-linejoin="round"/>
<polyline points="500,650 780,650 1060,650 1060,514 1450,514" fill="none" stroke="#6f4e37" stroke-width="13" stroke-linejoin="round"/>
<polygon points="1425,500 1446,514 1425,528" fill="#6f4e37"/>
<rect x="560" y="602" width="400" height="42" rx="10" fill="white" stroke="#6f4e37" stroke-width="3"/>
<text x="580" y="630" font-family="Arial" font-size="21" font-weight="700" fill="#6f4e37">Brown/black wire → GND, pin 6</text>

<polyline points="500,710 780,710 1100,710 1100,700 1330,700" fill="none" stroke="white" stroke-width="24" stroke-linejoin="round"/>
<polyline points="500,710 780,710 1100,710 1100,700 1330,700" fill="none" stroke="#f28c28" stroke-width="13" stroke-linejoin="round"/>
<polygon points="1305,686 1326,700 1305,714" fill="#f28c28"/>
<rect x="560" y="662" width="400" height="42" rx="10" fill="white" stroke="#f28c28" stroke-width="3"/>
<text x="580" y="690" font-family="Arial" font-size="21" font-weight="700" fill="#f28c28">Orange/yellow wire → GPIO17, pin 11</text>

<line x1="385" y1="590" x2="500" y2="590" stroke="#d62828" stroke-width="12"/>
<circle cx="500" cy="590" r="10" fill="#d62828" stroke="#202124" stroke-width="2"/>
<text x="115" y="597" font-family="Arial" font-size="23" font-weight="700" fill="#d62828">Red: power</text>

<line x1="385" y1="650" x2="500" y2="650" stroke="#6f4e37" stroke-width="12"/>
<circle cx="500" cy="650" r="10" fill="#6f4e37" stroke="#202124" stroke-width="2"/>
<text x="115" y="657" font-family="Arial" font-size="23" font-weight="700" fill="#6f4e37">Brown/black: ground</text>

<line x1="385" y1="710" x2="500" y2="710" stroke="#f28c28" stroke-width="12"/>
<circle cx="500" cy="710" r="10" fill="#f28c28" stroke="#202124" stroke-width="2"/>
<text x="115" y="717" font-family="Arial" font-size="23" font-weight="700" fill="#f28c28">Orange/yellow: signal</text>

<polygon points="1295,370 1310,350 1325,370" fill="#111"/>
<text x="1160" y="365" font-family="Arial" font-size="18" font-weight="700" fill="#202124">Pin 1 marker</text>

<rect x="80" y="820" width="1540" height="120" rx="20" fill="#fff3cd" stroke="#ba7a00" stroke-width="4"/>
<text x="115" y="875" font-family="Arial" font-size="28" font-weight="700" fill="#704b00">Important</text>
<text x="115" y="910" font-family="Arial" font-size="22" font-weight="700" fill="#5d4200">Use only one small, unloaded servo. Do not connect the red wire to 3.3V or to a GPIO pin.</text>
<text x="115" y="935" font-family="Arial" font-size="22" fill="#5d4200">Stop if the Pi restarts, reports undervoltage, or the servo buzzes continuously.</text>
</svg>
